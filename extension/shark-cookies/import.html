<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Import cookies - Shark Cookies</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page">
    <main>
      <header>
        <img src="icons/icon128.png" width="48" height="48" alt="" />
        <div>
          <div class="title big">Import cookies</div>
          <div class="sub">JSON (Cookie-Editor, EditThisCookie, Dolphin{Anty}, AdsPower, GoLogin, Puppeteer) or Netscape cookies.txt</div>
        </div>
      </header>

      <textarea id="text" spellcheck="false" placeholder="Paste cookies here…"></textarea>

      <div class="actions">
        <label class="file">
          <input type="file" id="file" accept=".json,.txt,application/json,text/plain" />
          <span>Load from file…</span>
        </label>
        <label class="chk"><input type="checkbox" id="replace" /> Delete existing cookies of the imported domains first</label>
        <span class="grow"></span>
        <button id="go" class="primary">Import</button>
      </div>
      <div id="msg" class="msg"></div>
    </main>
    <script type="module" src="import.js"></script>
  </body>
</html>

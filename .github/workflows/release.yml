name: Build

# Builds Windows, macOS and Linux installers. The repo can be private - this
# only produces the files; you upload them to your own website.
#
#   - push a tag like v1.3.0   -> builds all three and attaches them to a draft
#                                 GitHub release (download them from there)
#   - run it by hand (Actions -> Build -> Run workflow) -> builds all three and
#                                 uploads them as workflow artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: SharkAnty-windows
          - os: macos-latest
            platform: mac
            artifact: SharkAnty-macos
          - os: ubuntu-latest
            platform: linux
            artifact: SharkAnty-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # No code signing (keeps it free). macOS/Windows users approve the app once
      # via Gatekeeper / SmartScreen.
      - name: Build ${{ matrix.platform }}
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.blockmap' -o -name '*.yml' \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

      - name: Attach to draft release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
